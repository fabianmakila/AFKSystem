[versions]
strokkcommands = "2.3.1"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version = "26.3.build.+" }

dazzleconf = { module = "space.arim.dazzleconf:dazzleconf-toml", version = "2.0.0-M3" }
faststats = { module = "dev.faststats.metrics:bukkit", version = "0.31.0" }
strokkcommands-annotations-paper = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokkcommands" }
strokkcommands-processor-paper = { module = "net.strokkur.commands:processor-paper", version.ref = "strokkcommands" }

plugin-miniplaceholders = { module = "io.github.miniplaceholders:miniplaceholders-api", version = "3.2.0" }
plugin-placeholderapi = { module = "me.clip:placeholderapi", version = "2.12.3" }

[plugins]
resourcefactory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version = "1.4.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
versions = { id = "io.github.ben-manes.versions", version = "0.67.0" }